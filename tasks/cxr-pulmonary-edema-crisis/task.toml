schema_version = "1.4"
artifacts = [
    "/solution/episodes",
    { source = "/tmp/ground_truth.tsv", service = "mysql", destination = "ground_truth.tsv" },
]

[task]
name = "chartr/cxr-pulmonary-edema-crisis"
version = "1.0.0"
description = "Chest X-ray clinical review: critical multi-finding pulmonary edema crisis (cardiomegaly, worsening vascular congestion, bilateral effusions with R>L airspace disease) at SpO2 72% - tests under-escalation risk and whether the agent's action count calibrates to true severity (6 gold actions, the most of any case in this set)."
authors = []
keywords = ["cxr", "chest-xray", "radiology", "clinical-decision-making", "computer-use", "openemr", "under-escalation", "process-reward"]

[metadata]
difficulty = "hard"
category = "machine-learning"
difficulty_explanation = "Highest-stakes case in the set: SpO2 72%, RR33, severe WOB, confused mental status, 3 real findings competing for attention, and 6 gold actions (rapid response, intubation pathway, escalate care, nitroglycerin, IV furosemide, urgent assessment) - the most of any task, a real test of whether the agent's action count and escalation intensity calibrate to true severity rather than staying capped at a 'usual' 3-4."

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"

[verifier.environment]
os = "linux"
build_timeout_sec = 900.0

# Runs inside the `mysql` service itself (a channel the agent can't write
# to), after Harbor has stopped the agent's `main` container - dumps
# exactly the ground truth grade_process.py needs (patient/encounter
# resolution, the newpatient-form-exists check, and the 5-form
# NOTE_FORM_REGISTRY content check) to one file. The separate verifier
# then reads that file instead of ever making a live SQL connection -
# replaces the old grade_process.py::_run_sql live query approach.
[[verifier.collect]]
service = "mysql"
timeout_sec = 60.0
command = '''
bash -c '
set -u
OUT=/tmp/ground_truth.tsv
PATIENT_ID="GRDN00BKCEOKC7S1"
VISIT_DATE="2025-07-23"
MYSQL="mariadb -uroot -proot openemr"

run_section() {
    local label="$1"; local sql="$2"
    echo "===${label}==="
    $MYSQL -e "$sql" 2>/dev/null || true
}

{
run_section "PID_ENCOUNTER" \
  "SELECT pd.pid, fe.encounter FROM patient_data pd JOIN form_encounter fe ON fe.pid=pd.pid WHERE pd.lname=\"$PATIENT_ID\" AND DATE(fe.date)=\"$VISIT_DATE\";"

run_section "FORM_EXISTS:newpatient" \
  "SELECT COUNT(*) FROM forms f JOIN patient_data pd ON pd.pid=f.pid JOIN form_encounter fe ON fe.pid=f.pid AND fe.encounter=f.encounter WHERE pd.lname=\"$PATIENT_ID\" AND DATE(fe.date)=\"$VISIT_DATE\" AND f.formdir=\"newpatient\" AND f.deleted=0;"

run_section "NOTE_FORM:soap" \
  "SELECT s.subjective, s.objective, s.assessment, s.plan FROM forms f JOIN form_soap s ON s.id=f.form_id JOIN patient_data pd ON pd.pid=f.pid JOIN form_encounter fe ON fe.pid=f.pid AND fe.encounter=f.encounter WHERE pd.lname=\"$PATIENT_ID\" AND DATE(fe.date)=\"$VISIT_DATE\" AND f.formdir=\"soap\" ORDER BY f.id DESC LIMIT 1;"

run_section "NOTE_FORM:clinical_notes" \
  "SELECT s.description FROM forms f JOIN form_clinical_notes s ON s.id=f.form_id JOIN patient_data pd ON pd.pid=f.pid JOIN form_encounter fe ON fe.pid=f.pid AND fe.encounter=f.encounter WHERE pd.lname=\"$PATIENT_ID\" AND DATE(fe.date)=\"$VISIT_DATE\" AND f.formdir=\"clinical_notes\" ORDER BY f.id DESC LIMIT 1;"

run_section "NOTE_FORM:clinic_note" \
  "SELECT s.history, s.examination, s.plan FROM forms f JOIN form_clinic_note s ON s.id=f.form_id JOIN patient_data pd ON pd.pid=f.pid JOIN form_encounter fe ON fe.pid=f.pid AND fe.encounter=f.encounter WHERE pd.lname=\"$PATIENT_ID\" AND DATE(fe.date)=\"$VISIT_DATE\" AND f.formdir=\"clinic_note\" ORDER BY f.id DESC LIMIT 1;"

run_section "NOTE_FORM:note" \
  "SELECT s.message FROM forms f JOIN form_note s ON s.id=f.form_id JOIN patient_data pd ON pd.pid=f.pid JOIN form_encounter fe ON fe.pid=f.pid AND fe.encounter=f.encounter WHERE pd.lname=\"$PATIENT_ID\" AND DATE(fe.date)=\"$VISIT_DATE\" AND f.formdir=\"note\" ORDER BY f.id DESC LIMIT 1;"

run_section "NOTE_FORM:clinical_instructions" \
  "SELECT s.instruction FROM forms f JOIN form_clinical_instructions s ON s.id=f.form_id JOIN patient_data pd ON pd.pid=f.pid JOIN form_encounter fe ON fe.pid=f.pid AND fe.encounter=f.encounter WHERE pd.lname=\"$PATIENT_ID\" AND DATE(fe.date)=\"$VISIT_DATE\" AND f.formdir=\"clinical_instructions\" ORDER BY f.id DESC LIMIT 1;"
} > "$OUT"
'
'''

[agent]
timeout_sec = 1800.0

[agent.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
