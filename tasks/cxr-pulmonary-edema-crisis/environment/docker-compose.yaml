services:
  # Harbor requires a service literally named "main" - this is the agent's
  # own container (exec/cp/logs route here by default). Runs solution/solve.sh,
  # which drives agent_episode.py (Playwright + OpenRouter) against the
  # `openemr` service over the compose network.
  main:
    image: ghcr.io/lakshitavij/rad_harbor/main:latest
    networks:
      - default
    depends_on:
      openemr:
        condition: service_healthy
      dicom-loader:
        condition: service_completed_successfully
      recorder:
        condition: service_healthy
    environment:
      OPENEMR_BASE: "https://openemr"
      RECORDER_URL: "http://recorder:8080"
    tty: true
    stdin_open: true

  # The "security camera in the hallway": a separate service `main` can
  # only ever POST new events to (see ./recorder/recorder.py - no
  # edit/delete endpoint exists). Harbor pulls the finished log.jsonl out
  # of THIS service's own filesystem (task.toml's artifacts array) after
  # `main` is stopped, instead of trusting whatever `main` itself claims
  # happened - `main` never has filesystem access to what gets written
  # here, only network POST access to append to it.
  recorder:
    build: ./recorder
    networks:
      - default
    volumes:
      - recordervolume:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  # Only on db_net (internal, no route from main/orthanc/dicom-loader): the
  # separate verifier's [[verifier.collect]] hook execs inside this
  # container directly (not over the network), so mysql never needs to be
  # reachable by anything except openemr.
  mysql:
    build: ./mysql
    networks:
      - db_net
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: openemr
    volumes:
      - databasevolume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3

  # Custom image, built locally from ./openemr/Dockerfile: stock
  # openemr/openemr:8.3.0 plus the xray_viewer form module and
  # oe-module-xray-dashboard-link, which are NOT part of upstream OpenEMR
  # (confirmed via `git status` on the source checkout these were copied
  # from - both are untracked local additions).
  # On both networks: default to be reachable by main and to reach
  # orthanc (its DICOMweb proxy calls Orthanc server-side - main's browser
  # never talks to Orthanc directly), db_net to reach mysql.
  openemr:
    build: ./openemr
    networks:
      - default
      - db_net
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: root
      MYSQL_USER: openemr
      MYSQL_PASS: openemr
      OE_USER: admin
      OE_PASS: pass
      EASY_DEV_MODE: "yes"
      EASY_DEV_MODE_NEW: "yes"
      # vendor/public assets are pre-built and baked into the image (see
      # openemr/Dockerfile) - this skips the entrypoint's own composer/npm
      # rebuild-detection entirely, since node_modules (needed only to
      # rebuild, not to run) isn't shipped to keep the task portable.
      FORCE_NO_BUILD_MODE: "yes"
      DEVELOPER_TOOLS: "yes"
      OPENEMR_SETTING_rest_system_scopes_api: 1
      OPENEMR_SETTING_rest_api: 1
      OPENEMR_SETTING_rest_fhir_api: 1
      OPENEMR_SETTING_rest_portal_api: 1
      OPENEMR_SETTING_oauth_password_grant: 3
    volumes:
      - assetvolume:/var/www/localhost/htdocs/openemr/public/assets:rw
      - themevolume:/var/www/localhost/htdocs/openemr/public/themes:rw
      - sitesvolume:/var/www/localhost/htdocs/openemr/sites:rw
      - vendordir:/var/www/localhost/htdocs/openemr/vendor:rw
      - logvolume:/var/log
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/bin/curl
        - --fail
        - --insecure
        - --location
        - --show-error
        - --silent
        - https://localhost/meta/health/readyz
      start_period: 3m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3

  # Real DICOM/DICOMweb server the xray_viewer form reads from. No working
  # healthcheck command exists in this image (no curl/wget) - readiness is
  # instead polled over HTTP by dicom-loader before anything depends on it.
  orthanc:
    image: orthancteam/orthanc:26.7.0@sha256:99082b87c96d56e57472d703ad799b779da7aa35aedac830d58cce646a43643f
    networks:
      - default
    environment:
      ORTHANC__NAME: "ChartR Orthanc"
      ORTHANC__DICOM_AET: "CHARTR"
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
    volumes:
      - orthancvolume:/var/lib/orthanc/db

  # One-shot: waits for orthanc to actually answer, uploads this task's
  # single patient's real DICOM files, then exits. `main` waits on this
  # completing successfully before the agent starts.
  dicom-loader:
    image: ghcr.io/lakshitavij/rad_harbor/dicom-loader-pulmonary-edema-crisis:latest
    networks:
      - default
    depends_on:
      - orthanc
    restart: "no"

volumes:
  databasevolume: {}
  orthancvolume: {}
  assetvolume: {}
  themevolume: {}
  sitesvolume: {}
  vendordir: {}
  logvolume: {}
  recordervolume: {}

networks:
  default: {}
  # No route from main/orthanc/dicom-loader - only openemr and mysql sit
  # here. internal: true also blocks this network from reaching the
  # outside world, which mysql never needs.
  db_net:
    internal: true
